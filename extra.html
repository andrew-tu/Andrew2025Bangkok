<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>顯示網址 hash 內容</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f7f7f7; }
        .box { text-align:center; padding:2rem; background:#fff; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.06); max-width:90%; }
        .hash { font-size:1.25rem; color:#333; word-break:break-word; }
        .hint { margin-top:.75rem; color:#666; font-size:.9rem; }
    </style>
</head>
<body>
    <div class="box">
        <div class="hash" id="output">載入中…</div>
        <!-- <div class="hint">在網址列加入 #後的文字（例如：#Hello%20世界）</div> -->
    </div>

    <script>
        function showHash() {
            const raw = location.hash.slice(1); // 去掉 #
            const text = raw ? decodeURIComponent(raw) : '目前無 hash，請在網址加入 #文字';
            document.getElementById('output').textContent = text;
        }

        window.addEventListener('DOMContentLoaded', showHash);
        window.addEventListener('hashchange', showHash);
    </script>
</body>
</html>
