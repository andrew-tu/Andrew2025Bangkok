<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡單RWD網頁</title>
    <!-- 引用 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- 引用 jQuery -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <!-- 引用 JavaScript (可自訂) -->
        <script>
            $(document).ready(function(){
                console.log("網頁已載入並準備就緒！");

                renderRestaurantData(restaurants);
            });

            function renderRestaurantData(restaurantData) {
                if (typeof restaurantData !== 'undefined' && restaurantData.length > 0) {
                    let container = $('#myRestaurants');
                    container.empty(); // 清空現有內容

                    restaurantData.forEach(function(restaurant) {
                        let restaurantHTML = `
                            <div class="row" style="margin-top: 5px;margin-bottom: 5px;">
                                <!-- 左側圖片 -->
                                <div class="col-12 col-md-6 d-flex align-items-center justify-content-center mb-3 mb-md-0">
                                    <img src=${restaurant.image} class="img-fluid rounded shadow" alt="餐廳圖片">
                                </div>
                                <!-- 右側文字 -->
                                <div class="col-12 col-md-6 d-flex align-items-center">
                                    <div>
                                        <h2>${restaurant.name}</h2>
                                        <p>${restaurant.description}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.append(restaurantHTML);
                    });
                } else {
                    console.log("沒有餐廳資料可顯示。");
                }
            }
        </script>
    <!-- 引用自訂資料 JS -->
    <script src="mydata.js"></script>
</head>
<body class="bg-light">
    <header class="bg-primary text-white py-3 mb-4">
        <div class="container text-center">
            <h1 class="mb-0">曼谷小旅行</h1>
        </div>
    </header>
    <main class="container" id="myRestaurants">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10">
                <div class="row" style="margin-top: 5px;margin-bottom: 5px;">
                    <!-- 左側圖片 -->
                    <div class="col-12 col-md-6 d-flex align-items-center justify-content-center mb-3 mb-md-0">
                        <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=500&q=80" class="img-fluid rounded shadow" alt="餐廳圖片">
                    </div>
                    <!-- 右側文字 -->
                    <div class="col-12 col-md-6 d-flex align-items-center">
                        <div>
                            <h2>餐廳名稱範例</h2>
                            <p>這裡是餐廳的介紹文字。可描述餐廳特色、推薦菜色、地點等資訊。內容可依需求修改。</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
